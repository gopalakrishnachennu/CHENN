name: Deploy Firebase
on:
  push:
    branches: [prod]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    environment:
      name: production
      url: https://chenn.web.app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install --global firebase-tools@15.29.0
      - name: Start deployment record
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.repos.createDeployment({
              ...context.repo, ref: context.sha, environment: 'production',
              auto_merge: false, required_contexts: [], production_environment: true,
              description: 'Production branch release; automated checks required'
            });
            core.setOutput('id', result.data.id);
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: result.data.id, state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Test, deploy and verify exact revision
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: npm run deploy:firebase
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment/runs/
          if-no-files-found: ignore
          retention-days: 90
      - name: Record final status
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              environment_url: 'https://chenn.web.app',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
